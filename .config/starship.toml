format = """
[⟨](bold #9d4edd)$username[ ◆ ](bold #ff2a6d)$directory[⟩](bold #9d4edd) $git_branch$git_status$docker_context$character"""

[username]
show_always = true
style_user = "bold #e0aaff"
style_root = "bold #ff2a6d"
format = "[$user]($style)"

[directory]
style = "bold #c77dff"
format = "[$path]($style)"
truncation_length = 1
truncate_to_repo = false

[git_branch]
symbol = " "
style = "bold #ff70a6"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #ff2a6d"
format = '([$all_status$ahead_behind]($style) )'

[docker_context]
symbol = " "
style = "bold #c77dff"
format = "[$symbol$context]($style) "

[character]
success_symbol = "[❯](bold #9d4edd)[❯](bold #ff2a6d)"
error_symbol = "[✗](bold #ff2a6d)"
