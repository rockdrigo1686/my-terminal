set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Colores EVA-02
set -g status-style "bg=#170b0e,fg=#fff1eb"
set -g status-left "#[bg=#ff1e56,fg=#170b0e,bold] 02 #S #[bg=#170b0e,fg=#ff1e56] "
set -g status-right "#[fg=#ffb703] %H:%M #[bg=#ff7b00,fg=#170b0e,bold] #h "
setw -g window-status-format "#[fg=#7d4e57] #I:#W "
setw -g window-status-current-format "#[bg=#2e141a,fg=#ffb703,bold] #I:#W "
set -g pane-border-style "fg=#2e141a"
set -g pane-active-border-style "fg=#ff1e56"
set -g mode-style "bg=#4a141c,fg=#fff1eb,bold"

# Copiar al seleccionar con el mouse y pegar con el botón central
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -n MouseDown2Pane run "tmux set-buffer -b primary_selection \"$(xclip -o -selection primary)\"; tmux paste-buffer -b primary_selection; tmux delete-buffer -b primary_selection"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.tmux/plugins/tpm/tpm'
