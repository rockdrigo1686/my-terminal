set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Colores Morado + Verde Neón
set -g status-style "bg=#100b1c,fg=#f0e6ff"
set -g status-left "#[bg=#b829ea,fg=#100b1c,bold] ☣ #S #[bg=#100b1c,fg=#b829ea] "
set -g status-right "#[fg=#00ff87] %H:%M #[bg=#00ff87,fg=#100b1c,bold] #h "
setw -g window-status-format "#[fg=#6c568c] #I:#W "
setw -g window-status-current-format "#[bg=#24163b,fg=#00ff87,bold] #I:#W "
set -g pane-border-style "fg=#24163b"
set -g pane-active-border-style "fg=#00ff87"
set -g mode-style "bg=#3b1c54,fg=#f0e6ff,bold"

# Copiar al seleccionar con el mouse y pegar con el botón central
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -n MouseDown2Pane run "tmux set-buffer -b primary_selection \"$(xclip -o -selection primary)\"; tmux paste-buffer -b primary_selection; tmux delete-buffer -b primary_selection"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.tmux/plugins/tpm/tpm'
