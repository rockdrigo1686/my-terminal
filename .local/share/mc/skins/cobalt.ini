[skin]
    description = Cobalt Azul Blanco Rojo TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╦
    dbottommiddle = ╩
    dleftmiddle = ╠
    drightmiddle = ╣

[core]
    _default_ = #f8f9fa;#0b132b
    selected = #0b132b;#4cc9f0;bold
    marked = #ef233c;#0b132b;bold
    markselect = #f8f9fa;#ef233c;bold
    gauge = #f8f9fa;#3a86ff
    input = #f8f9fa;#1c2541
    inputunchanged = #5c6b9c;#1c2541
    inputmark = #0b132b;#f8f9fa
    disabled = #5c6b9c;#0b132b
    reverse = #0b132b;#4cc9f0
    commandlinemark = #f8f9fa;#ef233c
    header = #4cc9f0;#0b132b;bold

[dialog]
    _default_ = #f8f9fa;#1c2541
    dfocus = #f8f9fa;#3a86ff;bold
    dhotnormal = #ef233c;#1c2541;bold
    dhotfocus = #f8f9fa;#ef233c;bold
    dtitle = #4cc9f0;#1c2541;bold

[error]
    _default_ = #f8f9fa;#6b0f1a
    errdfocus = #0b132b;#f8f9fa;bold
    errdhotnormal = #4cc9f0;#6b0f1a;bold
    errdhotfocus = #0b132b;#4cc9f0;bold
    errdtitle = #f8f9fa;#6b0f1a;bold

[filehighlight]
    directory = #4cc9f0;;bold
    executable = #ef233c;;bold
    symlink = #a9d6e5;;italic
    hardlink = #a9d6e5;
    stalelink = #ef233c;
    device = #f8f9fa;
    special = #3a86ff;
    core = #ef233c;
    temp = #5c6b9c;
    archive = #3a86ff;
    doc = #f8f9fa;
    source = #4cc9f0;
    media = #90e0ef;
    graph = #a9d6e5;
    database = #3a86ff;

[menu]
    _default_ = #f8f9fa;#1c2541
    menusel = #f8f9fa;#3a86ff;bold
    menuhot = #ef233c;#1c2541;bold
    menuhotsel = #f8f9fa;#ef233c;bold
    menuinactive = #5c6b9c;#1c2541

[popupmenu]
    _default_ = #f8f9fa;#1c2541
    menusel = #0b132b;#4cc9f0;bold
    menutitle = #f8f9fa;#1c2541;bold

[buttonbar]
    hotkey = #ef233c;#0b132b;bold
    button = #f8f9fa;#1c2541

[statusbar]
    _default_ = #f8f9fa;#1c2541
