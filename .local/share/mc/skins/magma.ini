[skin]
    description = EVA-02 Rojo Naranja Ambar TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╦
    dbottommiddle = ╩
    dleftmiddle = ╠
    drightmiddle = ╣

[core]
    _default_ = #fff1eb;#170b0e
    selected = #170b0e;#ff7b00;bold
    marked = #ffb703;#170b0e;bold
    markselect = #170b0e;#ffb703;bold
    gauge = #170b0e;#ff1e56
    input = #fff1eb;#2e141a
    inputunchanged = #7d4e57;#2e141a
    inputmark = #170b0e;#ffb703
    disabled = #7d4e57;#170b0e
    reverse = #170b0e;#ff7b00
    commandlinemark = #170b0e;#ffb703
    header = #ff1e56;#170b0e;bold
    inputhistory =
    commandhistory =

[dialog]
    _default_ = #fff1eb;#2e141a
    dfocus = #170b0e;#ff1e56;bold
    dhotnormal = #ffb703;#2e141a;bold
    dhotfocus = #170b0e;#ffb703;bold
    dtitle = #ff7b00;#2e141a;bold

[error]
    _default_ = #fff1eb;#590d22
    errdfocus = #170b0e;#ffb703;bold
    errdhotnormal = #ffd166;#590d22;bold
    errdhotfocus = #170b0e;#ffd166;bold
    errdtitle = #ffb703;#590d22;bold

[filehighlight]
    directory = #ff7b00;;bold
    executable = #ff1e56;;bold
    symlink = #ffb703;;italic
    hardlink = #ffb703;
    stalelink = #ff1e56;
    device = #ffd166;
    special = #ff5400;
    core = #ff1e56;
    temp = #7d4e57;
    archive = #ffb703;
    doc = #ffd166;
    source = #ff7b00;
    media = #ff9e00;
    graph = #ffb703;
    database = #ff5400;

[menu]
    _default_ = #fff1eb;#2e141a
    menusel = #170b0e;#ff1e56;bold
    menuhot = #ffb703;#2e141a;bold
    menuhotsel = #170b0e;#ffb703;bold
    menuinactive = #7d4e57;#2e141a

[popupmenu]
    _default_ = #fff1eb;#2e141a
    menusel = #170b0e;#ff7b00;bold
    menutitle = #ff1e56;#2e141a;bold

[buttonbar]
    hotkey = #ff1e56;#170b0e;bold
    button = #ffb703;#2e141a

[statusbar]
    _default_ = #fff1eb;#2e141a

[help]
    _default_ = #fff1eb;#2e141a
    helpitalic = #ffb703;#2e141a;italic
    helpbold = #ff1e56;#2e141a;bold
    helplink = #ff7b00;#2e141a;underline
    helpslink = #170b0e;#ff7b00;bold
    helptitle = #ffb703;#2e141a;bold

[editor]
    _default_ = #fff1eb;#170b0e
    editbold = #ff1e56;#170b0e;bold
    editmarked = #fff1eb;#4a141c
    editwhitespace = #4a141c;#170b0e
    editlinestate = #7d4e57;#2e141a
    bookmark = #170b0e;#ff7b00
    bookmarkfound = #170b0e;#ffb703
    editrightmargin = #4a141c;#170b0e
    editbg = #170b0e;#170b0e
    editframe = #7d4e57;#170b0e
    editframeactive = #ff1e56;#170b0e
    editframedrag = #ff7b00;#170b0e

[viewer]
    _default_ = #fff1eb;#170b0e
    viewbold = #ff1e56;#170b0e;bold
    viewunderline = #ffb703;#170b0e;underline
    viewselected = #fff1eb;#4a141c
