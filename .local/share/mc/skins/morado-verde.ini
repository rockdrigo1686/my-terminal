[skin]
    description = Neon Morado Verde TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╦
    dbottommiddle = ╩
    dleftmiddle = ╠
    drightmiddle = ╣

[core]
    _default_ = #f0e6ff;#100b1c
    selected = #100b1c;#00ff87;bold
    marked = #b829ea;#100b1c;bold
    markselect = #100b1c;#b829ea;bold
    gauge = #100b1c;#b829ea
    input = #f0e6ff;#24163b
    inputunchanged = #6c568c;#24163b
    inputmark = #100b1c;#00ff87
    disabled = #6c568c;#100b1c
    reverse = #100b1c;#00ff87
    commandlinemark = #100b1c;#b829ea
    header = #b829ea;#100b1c;bold
    inputhistory =
    commandhistory =

[dialog]
    _default_ = #f0e6ff;#24163b
    dfocus = #100b1c;#00ff87;bold
    dhotnormal = #b829ea;#24163b;bold
    dhotfocus = #100b1c;#b829ea;bold
    dtitle = #00ff87;#24163b;bold

[error]
    _default_ = #f0e6ff;#4a1530
    errdfocus = #100b1c;#ff2a6d;bold
    errdhotnormal = #00ff87;#4a1530;bold
    errdhotfocus = #100b1c;#00ff87;bold
    errdtitle = #ff2a6d;#4a1530;bold

[filehighlight]
    directory = #00ff87;;bold
    executable = #b829ea;;bold
    symlink = #c77dff;;italic
    hardlink = #c77dff;
    stalelink = #ff2a6d;
    device = #39ff14;
    special = #b829ea;
    core = #ff2a6d;
    temp = #6c568c;
    archive = #c77dff;
    doc = #80ffdb;
    source = #00ff87;
    media = #e0aaff;
    graph = #c77dff;
    database = #9d4edd;

[menu]
    _default_ = #f0e6ff;#24163b
    menusel = #100b1c;#00ff87;bold
    menuhot = #c77dff;#24163b;bold
    menuhotsel = #100b1c;#b829ea;bold
    menuinactive = #6c568c;#24163b

[popupmenu]
    _default_ = #f0e6ff;#24163b
    menusel = #100b1c;#00ff87;bold
    menutitle = #b829ea;#24163b;bold

[buttonbar]
    hotkey = #00ff87;#100b1c;bold
    button = #c77dff;#24163b

[statusbar]
    _default_ = #f0e6ff;#24163b

[help]
    _default_ = #f0e6ff;#24163b
    helpitalic = #c77dff;#24163b;italic
    helpbold = #00ff87;#24163b;bold
    helplink = #39ff14;#24163b;underline
    helpslink = #100b1c;#39ff14;bold
    helptitle = #b829ea;#24163b;bold

[editor]
    _default_ = #f0e6ff;#100b1c
    editbold = #00ff87;#100b1c;bold
    editmarked = #f0e6ff;#3b1c54
    editwhitespace = #3b1c54;#100b1c
    editlinestate = #6c568c;#24163b
    bookmark = #100b1c;#b829ea
    bookmarkfound = #100b1c;#00ff87
    editrightmargin = #3b1c54;#100b1c
    editbg = #100b1c;#100b1c
    editframe = #6c568c;#100b1c
    editframeactive = #00ff87;#100b1c
    editframedrag = #b829ea;#100b1c

[viewer]
    _default_ = #f0e6ff;#100b1c
    viewbold = #00ff87;#100b1c;bold
    viewunderline = #c77dff;#100b1c;underline
    viewselected = #f0e6ff;#3b1c54
