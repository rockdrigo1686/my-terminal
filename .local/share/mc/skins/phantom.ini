[skin]
    description = Phantom Gengar TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╦
    dbottommiddle = ╩
    dleftmiddle = ╠
    drightmiddle = ╣

[core]
    _default_ = #f3e8ff;#140d1f
    selected = #140d1f;#e0aaff;bold
    marked = #ff2a6d;#140d1f;bold
    markselect = #f3e8ff;#ff2a6d;bold
    gauge = #f3e8ff;#9d4edd
    input = #f3e8ff;#27183b
    inputunchanged = #6b5280;#27183b
    inputmark = #140d1f;#f3e8ff
    disabled = #6b5280;#140d1f
    reverse = #140d1f;#e0aaff
    commandlinemark = #f3e8ff;#ff2a6d
    header = #e0aaff;#140d1f;bold

[dialog]
    _default_ = #f3e8ff;#27183b
    dfocus = #f3e8ff;#7b2cbf;bold
    dhotnormal = #ff2a6d;#27183b;bold
    dhotfocus = #f3e8ff;#ff2a6d;bold
    dtitle = #e0aaff;#27183b;bold

[error]
    _default_ = #f3e8ff;#590d22
    errdfocus = #140d1f;#f3e8ff;bold
    errdhotnormal = #ff70a6;#590d22;bold
    errdhotfocus = #140d1f;#ff70a6;bold
    errdtitle = #f3e8ff;#590d22;bold

[filehighlight]
    directory = #e0aaff;;bold
    executable = #ff2a6d;;bold
    symlink = #ff70a6;;italic
    hardlink = #ff70a6;
    stalelink = #ff2a6d;
    device = #f3e8ff;
    special = #9d4edd;
    core = #ff2a6d;
    temp = #6b5280;
    archive = #c77dff;
    doc = #f3e8ff;
    source = #e0aaff;
    media = #ff70a6;
    graph = #c77dff;
    database = #7b2cbf;

[menu]
    _default_ = #f3e8ff;#27183b
    menusel = #f3e8ff;#7b2cbf;bold
    menuhot = #ff2a6d;#27183b;bold
    menuhotsel = #f3e8ff;#ff2a6d;bold
    menuinactive = #6b5280;#27183b

[popupmenu]
    _default_ = #f3e8ff;#27183b
    menusel = #140d1f;#e0aaff;bold
    menutitle = #ff70a6;#27183b;bold

[buttonbar]
    hotkey = #ff2a6d;#140d1f;bold
    button = #e0aaff;#27183b

[statusbar]
    _default_ = #f3e8ff;#27183b
