[skin]
    description = Cyber Rosa Cyan TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╦
    dbottommiddle = ╩
    dleftmiddle = ╠
    drightmiddle = ╣

[core]
    _default_ = #f8f8f2;#13111c
    selected = #13111c;#00f5d4;bold
    marked = #ff79c6;#13111c;bold
    markselect = #13111c;#ff2a85;bold
    gauge = #13111c;#ff79c6
    input = #f8f8f2;#211d30
    inputunchanged = #6272a4;#211d30
    inputmark = #13111c;#8be9fd
    disabled = #6272a4;#13111c
    reverse = #13111c;#ff79c6
    commandlinemark = #13111c;#00f5d4
    header = #ff2a85;#13111c;bold
    inputhistory =
    commandhistory =

[dialog]
    _default_ = #f8f8f2;#211d30
    dfocus = #13111c;#ff2a85;bold
    dhotnormal = #00f5d4;#211d30;bold
    dhotfocus = #13111c;#00f5d4;bold
    dtitle = #ff79c6;#211d30;bold

[error]
    _default_ = #f8f8f2;#4a152c
    errdfocus = #13111c;#ff2a85;bold
    errdhotnormal = #8be9fd;#4a152c;bold
    errdhotfocus = #13111c;#8be9fd;bold
    errdtitle = #ff2a85;#4a152c;bold

[filehighlight]
    directory = #ff79c6;;bold
    executable = #00f5d4;;bold
    symlink = #bd93f9;;italic
    hardlink = #bd93f9;
    stalelink = #ff5555;
    device = #8be9fd;
    special = #ff2a85;
    core = #ff5555;
    temp = #6272a4;
    archive = #bd93f9;
    doc = #8be9fd;
    source = #00f5d4;
    media = #ff79c6;
    graph = #bd93f9;
    database = #00bbf9;

[menu]
    _default_ = #f8f8f2;#211d30
    menusel = #13111c;#ff2a85;bold
    menuhot = #00f5d4;#211d30;bold
    menuhotsel = #13111c;#00f5d4;bold
    menuinactive = #6272a4;#211d30

[popupmenu]
    _default_ = #f8f8f2;#211d30
    menusel = #13111c;#00f5d4;bold
    menutitle = #ff2a85;#211d30;bold

[buttonbar]
    hotkey = #ff2a85;#13111c;bold
    button = #8be9fd;#211d30

[statusbar]
    _default_ = #f8f8f2;#211d30

[help]
    _default_ = #f8f8f2;#211d30
    helpitalic = #bd93f9;#211d30;italic
    helpbold = #ff79c6;#211d30;bold
    helplink = #00f5d4;#211d30;underline
    helpslink = #13111c;#00f5d4;bold
    helptitle = #ff2a85;#211d30;bold

[editor]
    _default_ = #f8f8f2;#13111c
    editbold = #ff79c6;#13111c;bold
    editmarked = #f8f8f2;#16425b
    editwhitespace = #3b2d5e;#13111c
    editlinestate = #6272a4;#211d30
    bookmark = #13111c;#bd93f9
    bookmarkfound = #13111c;#00f5d4
    editrightmargin = #3b2d5e;#13111c
    editbg = #13111c;#13111c
    editframe = #6272a4;#13111c
    editframeactive = #00f5d4;#13111c
    editframedrag = #ff2a85;#13111c

[viewer]
    _default_ = #f8f8f2;#13111c
    viewbold = #ff79c6;#13111c;bold
    viewunderline = #00f5d4;#13111c;underline
    viewselected = #f8f8f2;#16425b
