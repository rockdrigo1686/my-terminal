    executable = #eb6f92;;bold
    symlink = #c4a7e7;;italic
    hardlink = #c4a7e7;
    stalelink = #eb6f92;
    device = #f6c177;
    special = #ebbcba;
    core = #eb6f92;
    temp = #6e6a86;
    archive = #c4a7e7;
    doc = #ebbcba;
    source = #9ccfd8;
    media = #f6c177;
    graph = #ebbcba;
    database = #31748f;

[menu]
