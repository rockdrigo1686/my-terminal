[skin]
    description = Rose Pine TrueColor
    256colors = true
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = #e0def4;#191724
    selected = #191724;#eb6f92;bold
    marked = #f6c177;#191724;bold
    markselect = #191724;#f6c177;bold
    gauge = #191724;#9ccfd8
    input = #e0def4;#26233a
    inputunchanged = #908caa;#26233a
    inputmark = #191724;#ebbcba
    disabled = #6e6a86;#191724
    reverse = #191724;#ebbcba
    commandlinemark = #191724;#9ccfd8
    header = #ebbcba;#191724;bold
    inputhistory =
    commandhistory =

[dialog]
    _default_ = #e0def4;#26233a
    dfocus = #191724;#eb6f92;bold
    dhotnormal = #9ccfd8;#26233a;bold
    dhotfocus = #191724;#9ccfd8;bold
    dtitle = #eb6f92;#26233a;bold

[error]
    _default_ = #e0def4;#52293b
    errdfocus = #191724;#eb6f92;bold
    errdhotnormal = #f6c177;#52293b;bold
    errdhotfocus = #191724;#f6c177;bold
    errdtitle = #eb6f92;#52293b;bold

[filehighlight]
