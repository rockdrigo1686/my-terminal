set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

# Colores Rosé Pine
set -g status-style "bg=#191724,fg=#e0def4"
set -g status-left "#[bg=#eb6f92,fg=#191724,bold]  #S #[bg=#191724,fg=#eb6f92] "
set -g status-right "#[fg=#c4a7e7] %H:%M #[bg=#9ccfd8,fg=#191724,bold] #h "
setw -g window-status-format "#[fg=#6e6a86] #I:#W "
setw -g window-status-current-format "#[bg=#26233a,fg=#ebbcba,bold] #I:#W "
set -g pane-border-style "fg=#26233a"
set -g pane-active-border-style "fg=#eb6f92"

# Plugins para guardar y restaurar sesiones automáticamente
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restaurar automáticamente al iniciar tmux y guardar cada 15 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Inicializar TPM (siempre al final del archivo)
run '~/.tmux/plugins/tpm/tpm'

# Plugins para guardar y restaurar sesiones automáticamente
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restaurar automáticamente al iniciar tmux y guardar cada 15 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Inicializar TPM (siempre al final del archivo)
run '~/.tmux/plugins/tpm/tpm'

# Copiar al seleccionar con el mouse y pegar con el botón central (ruedita)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"
bind-key -n MouseDown2Pane run "tmux set-buffer -b primary_selection \"$(xclip -o -selection primary)\"; tmux paste-buffer -b primary_selection; tmux delete-buffer -b primary_selection"
set -g mode-style "bg=#52293b,fg=#e0def4,bold"
